<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-qekHSE0AfjKytQi/IgGyWVcjpp1lu2NzOdSkmS1Y49U='; script-src 'sha256-nM8j9h8qXEuXqTyzdlBNPSxPYYh3bTpmr3Hgmb16SlQ='; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>ASO Copilot</title>
<style>/* One style sheet, inlined and allowed by its hash. Colours and type are tokens; nothing is loaded from outside. */
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--hair:#e1e0d9;--axis:#c3c2b7;
  --b1:#184f95;--b2:#2a78d6;--b3:#5598e7;--b4:#86b6ef;--orange:#eb6834;
  --worked:#0ca30c;--noeffect:#898781;--adverse:#d03b3b;--due:#fab219;
  --hatch:repeating-linear-gradient(135deg,#eeede8 0 2px,transparent 2px 7px);
  --text:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --head:"Space Grotesk",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--text)}
a{color:var(--ink2)}a:hover{color:var(--ink)}
h2,h3,p,ul,dl,dd{margin:0}ul{padding:0;list-style:none}
.meta,.sub{color:var(--ink2);font-size:12px}
.cap,.tile h3{font:600 11px/1.3 var(--text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.chip{font:12px var(--mono);color:var(--ink2);border:1px solid var(--axis);border-radius:4px;padding:2px 8px}

/* header and tabs */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:14px 32px;border-bottom:1px solid var(--axis)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand a{font:700 19px var(--head);color:var(--ink);text-decoration:none}
#tabs{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px}
#tabs a{text-decoration:none;padding:6px 0 4px;border-bottom:2px solid transparent}
#tabs a[aria-current]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
#as-of{margin-left:auto;font:12px var(--mono)}
main{max-width:1360px;margin:0 auto;padding:24px 32px 56px;display:flex;flex-direction:column;gap:28px}

/* a figure: a value to open, an approximation, or the words for why it is missing */
.fig{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:1px dotted var(--axis)}
.fig:hover,.fig:focus-visible{border-bottom-color:var(--ink)}
.missing{font:500 12px var(--text);color:var(--ink2);background:var(--hatch);border:1px dashed var(--axis);
  border-radius:4px;padding:2px 8px;display:inline-block}
.fig.approx{color:#5a3fb5}

/* sources strip */
.strip{display:flex;flex-direction:column;gap:8px}
.sources{display:flex;flex-wrap:wrap;gap:8px}
.sources li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);
  border-radius:4px;padding:5px 10px;font-size:12px}
.src-name{font-weight:600}.src-day{color:var(--ink2)}
.age{font:11px var(--mono);background:var(--hair);border-radius:3px;padding:1px 6px}
.age.stale{background:var(--due)}

/* tiles and blocks */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.tile,.block{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:14px 16px;
  display:flex;flex-direction:column;gap:6px;min-width:0}
.num{font:500 30px/1.15 var(--mono)}
.num .missing{font-size:13px}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.block{gap:10px;padding:16px 18px}
.block h2{font:600 17px var(--head)}
.lead{font-size:13px}
.rows li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--hair);font-size:13px;align-items:baseline}
.id{font:600 12px var(--mono)}
.pairs{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:baseline}
.pairs dd{font:500 15px var(--mono);text-align:right}

/* charts: geometry lives in attributes, colour here */
.spark{width:120px;height:28px;align-self:flex-start}
.spark polyline{fill:none;stroke:var(--b2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--b2)}
.bar{display:block;width:100%;height:8px;border-radius:4px}
.bar .track{fill:var(--hair)}.bar .fill{fill:var(--b2)}
.stack{display:block;width:100%;height:14px;border-radius:4px}
.band-top10{fill:var(--b1)}.band-top30{fill:var(--b2)}.band-top100{fill:var(--b3)}.band-top200{fill:var(--b4)}

/* the panel behind a figure */
dialog{border:1px solid var(--axis);border-radius:8px;padding:20px 22px;max-width:min(520px,92vw);
  background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(11,11,11,.35)}
dialog h2{font:600 18px var(--head);margin-bottom:4px}
dialog p{margin-top:10px}
.panel-value{font:500 26px var(--mono)}
.panel-value .chip,.panel-value .missing{font-size:12px;vertical-align:middle}
.def{font-size:13px}
.split{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 14px;font:12px var(--mono)}
.split li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--hair);padding:2px 0}
.close{font:inherit;min-height:44px;padding:0 18px;border:1px solid var(--axis);border-radius:6px;background:var(--page);cursor:pointer}

@media (max-width:700px){.top{padding:12px 16px}main{padding:16px 16px 40px}#as-of{margin-left:0}}

/* ledger */
h1.page{font:600 20px var(--head);margin:0}
.mono{font-family:var(--mono);font-size:12px}.strong{font-weight:600}
.rows.two li{grid-template-columns:52px minmax(0,1fr)}
.next li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 52px;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);
  font-size:13px;align-items:baseline}
.next .strong{text-align:right}
.squares{display:flex;flex-wrap:wrap;gap:4px}
.sq{width:16px;height:16px;border-radius:3px;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.legend li{display:flex;align-items:center;gap:7px}
.legend .sq{width:12px;height:12px}
.m-worked{background:var(--worked);fill:var(--worked)}
.m-no-effect{background:var(--noeffect);fill:var(--noeffect)}
.m-adverse{background:var(--adverse);fill:var(--adverse)}
.m-due{background:var(--due);fill:var(--due)}
.m-open{background:var(--b2);fill:var(--b2)}
.m-withheld{background:repeating-linear-gradient(135deg,var(--noeffect) 0 2px,var(--surface) 2px 5px);
  border:1px solid var(--noeffect);fill:var(--noeffect);fill-opacity:.35;stroke:var(--noeffect)}
.m-not-shipped,.m-judged{background:var(--surface);border:1px solid var(--noeffect);fill:var(--surface);stroke:var(--noeffect)}
.chip.due{background:var(--due);border-color:var(--due);color:var(--ink)}
.scroll{overflow-x:auto}
.timeline{display:block;width:100%;min-width:760px;height:auto}
.tl-month{stroke:var(--hair)}.tl-release{stroke:var(--axis)}.tl-today{stroke:var(--ink)}
.tl-axis{font:11px var(--mono);fill:var(--ink2)}.tl-axis.strong{fill:var(--ink);font-weight:600}
.tl-id{font:600 12px var(--mono);fill:var(--ink)}.tl-title{font:13px var(--text);fill:var(--ink)}
.due-card h2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.note{background:var(--hatch);border:1px dashed var(--axis);border-radius:4px;padding:8px 10px;font-size:13px;color:var(--ink2)}
.rank-chart{display:block;width:100%;min-width:560px;height:auto}
.rank-chart .grid{stroke:var(--hair)}
.v-live{stroke:var(--ink)}.v-end{stroke:var(--due);stroke-width:2}.v-today{stroke:var(--ink);stroke-dasharray:2 3}
.rank-chart polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
polyline.s1{stroke:#2a78d6}polyline.s2{stroke:#eb6834}polyline.s3{stroke:#1baf7a}polyline.s4{stroke:#eda100}polyline.s-rest{stroke:var(--noeffect)}
circle.s1,rect.s1{fill:#2a78d6}circle.s2,rect.s2{fill:#eb6834}circle.s3,rect.s3{fill:#1baf7a}circle.s4,rect.s4{fill:#eda100}
circle.s-rest,rect.s-rest{fill:var(--noeffect)}
.rank-chart circle{stroke:var(--surface);stroke-width:1.5}
.swatch{width:14px;height:4px;flex:none}
.terms{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:13px}
.terms dt{font:600 11px var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding-top:2px}
@media (max-width:700px){.terms{grid-template-columns:1fr}}

/* keywords */
.blocks.wide{grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))}
.band-chart{display:block;width:100%;max-width:900px;min-width:420px;height:auto}
.col-track{fill:var(--hair)}.band-chart .grid{stroke:var(--axis)}
.swatch.tall{width:12px;height:12px}
.grid-table{border-collapse:collapse;width:100%;font-size:13px}
.grid-table th{font:600 11px var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);text-align:right;
  padding:6px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
.grid-table td{padding:6px 10px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--mono);font-size:12px}
.grid-table th:first-child,.grid-table td:first-child{text-align:left}
.grid-table.keys th:nth-child(-n+4),.grid-table.keys td:nth-child(-n+4){text-align:left}
.grid-table.keys td:nth-child(2){font-family:var(--text);font-size:13px}
.grid-table .spark{width:96px;height:22px}
tr.is-brand td{color:var(--ink2)}
.bars li{display:grid;grid-template-columns:28px minmax(60px,1fr) 150px;gap:10px;align-items:center;padding:4px 0}
.bars .mono{text-align:right}

/* the remaining tabs */
.next.three li{grid-template-columns:28px auto minmax(0,1fr) 52px 96px;align-items:center}
.next .spark{width:96px;height:22px;align-self:center}
.next.range li{grid-template-columns:28px minmax(0,1fr) auto 112px}
.plain{display:flex;flex-direction:column;gap:6px;font-size:13px;list-style:disc;padding-left:18px}
.terms dd .mono{font-weight:600}
main>.block{gap:10px}
</style>

// The page's logic. Every function that returns markup is pure: data in, a string out, no DOM. The DOM is touched

var ASO = { pages: {} };

ASO.group = function (digits) { return String(digits).replace(/\B(?=(\d{3})+(?!\d))/g, ","); };

    return (value < 0 ? "−$" : "$") + ASO.group(parts[0]) + "." + parts[1];

  return Number.isInteger(value) ? ASO.group(value) : value.toFixed(1);
};

ASO.days = function (from, to) {

ASO.unit = function (spec, entry) {

ASO.mark = function (h) { return h.state === "judged" ? (h.verdict || "judged") : h.state; };

// ---- shell
ASO.route = function (hash) { return !hash || hash === "#" ? "#/" : hash; };

ASO.nav = function (hash) {
  var current = ASO.route(hash);
  return ASO.TABS.map(function (tab) {
    return '<a href="' + tab[0] + '"' + (tab[0] === current ? ' aria-current="page"' : "") + ">" + ASO.esc(tab[1]) + "</a>";
  }).join("");
};

ASO.render = function (hash, payload, today) {
  var page = ASO.pages[ASO.route(hash)];
  if (!page) { return '<section class="block"><h2>No such page</h2><p><a href="#/">Back to the overview</a></p></section>'; }
  return page(payload, today);
};

// ---- the panel behind a figure
ASO.panel = function (payload, key, periodId) {
  var spec = ASO.spec(payload, key), family = payload.catalog.families[ASO.split(key)[0]];
  var entry = ASO.series(payload, key).filter(function (e) { return e.id === periodId; })[0];
  // the two totals of a ratio are named as the reader knows them: by their figure's title, in lower case
  function named(part) { return family.figures[part] ? family.figures[part].title.toLowerCase() : part; }
  var out = '<h2 id="figure-title">' + ASO.esc(spec.title) + '</h2><p class="meta">' + ASO.esc(family.title) + " · " +
    ASO.esc(family.kind === "week" ? "week of " : "read on ") + ASO.esc(periodId) + "</p>";
  if (!entry || entry.unavailable) {
    var gone = entry ? entry.unavailable : { code: "no_source", reason: "No data file holds this figure for that period." };
    out += '<p class="panel-value"><span class="missing">' + ASO.esc(ASO.MISSING[gone.code]) + "</span></p><p>" +
      ASO.esc(gone.reason) + '</p><p class="meta">code: ' + ASO.esc(gone.code) + "</p>";
  } else {
    out += '<p class="panel-value">' + ASO.esc(ASO.fmt(entry.value, ASO.unit(spec, entry))) + ' <span class="chip">' +
      (spec.approximation ? "Approximation" : "Measured") + "</span></p>";
    if (typeof entry.numerator === "number" && typeof entry.denominator === "number") {
      out += "<p>" + ASO.group(entry.numerator) + " of " + ASO.group(entry.denominator) +
        (spec.ratio ? ' <span class="meta">(' + ASO.esc(named(spec.ratio[0])) + " over " + ASO.esc(named(spec.ratio[1])) + ")</span>" : "") + "</p>";
    }
    if (spec.approximation) { out += "<p>" + ASO.esc(spec.approximation) + "</p>"; }
  }
  out += '<p class="def">' + ASO.esc(spec.definition) + "</p>";
  if (entry && entry.source) {
    out += '<p class="meta">source: ' + ASO.esc(entry.source) + " · fetched " + ASO.esc(entry.fetched_at) + "</p>";
  }
  ["by_market", "by_campaign"].forEach(function (name) {
    var parts = entry && entry[name];
    if (!parts) { return; }
    out += '<ul class="split">' + Object.keys(parts).sort().map(function (who) {
      return "<li><span>" + ASO.esc(who) + "</span> <span>" +
        (parts[who] === null ? ASO.esc(ASO.MISSING.no_data) : ASO.esc(ASO.fmt(parts[who], spec.unit))) + "</span></li>";
    }).join("") + "</ul>";
  });
  return out + '<p><button class="close" data-close="1">Close</button></p>';
};

// Overview: how old each source is, six headline figures, and one summary block per tab.
ASO.SOURCES = [["Keyword ranks", "ranks"], ["Store funnel", "store_funnel"], ["Install lifecycle", "lifecycle"],
               ["Money", "money"], ["Apple Ads", "ads"], ["In-app", "in_app"], ["Subscriptions", "subscriptions"],
               ["Ratings and reviews", "ratings"], ["Apple search popularity", "demand"]];

ASO.sources = function (payload, today) {
  return '<ul class="sources">' + ASO.SOURCES.map(function (source) {
    // ranks are as fresh as the newest sweep that covered the basket; a later read of three keys does not refresh them
    var sweep = ASO.last(ASO.fullSweeps(payload));
    var day = source[1] === "ranks" ? (sweep ? sweep.period.id : null) : ASO.fetched(payload, source[1]);
    return '<li><span class="src-name">' + ASO.esc(source[0]) + "</span> " +
      (day ? '<span class="src-day">' + ASO.esc(day) + "</span> " + ASO.age(day, today) : ASO.missing("no_source")) + "</li>";
  }).join("") + "</ul>";
};

ASO.stateLine = function (payload) {
  var counts = ASO.countStates(payload);
  return ASO.STATES.filter(function (s) { return counts[s[0]]; }).map(function (s) { return counts[s[0]] + " " + s[1]; }).join(" · ");
};

ASO.headlineTiles = function (payload) {
  var sweep = ASO.last(ASO.fullSweeps(payload)), tiles = [];
  tiles.push(ASO.tile("Hypotheses", String(payload.hypotheses.hypotheses.length), ASO.esc(ASO.stateLine(payload))));

  var shares = ASO.series(payload, "ranks.share_top30").filter(function (e) {
    return ASO.fullSweeps(payload).some(function (file) { return file.period.id === e.id; });
  });
  var share = sweep ? shares.filter(function (e) { return e.id === sweep.period.id; })[0] : null;
  var top10 = sweep ? sweep.families.ranks.figures.top10.value : null;
  tiles.push(ASO.tile("Keys in top 30", ASO.figure(payload, "ranks.share_top30", share, "numerator"),
    share && !share.unavailable ? "of " + ASO.group(share.denominator) + " keys read · " + ASO.group(top10) + " in top 10 · sweep of " +
      ASO.esc(sweep.period.id) : "",
    ASO.spark(ASO.values(shares).map(function (e) { return e.value; }), "Share of keys in the top 30, sweep by sweep")));

  var downloads = ASO.series(payload, "store_funnel.first_downloads"), week = ASO.last(downloads);
  var seen = ASO.last(ASO.series(payload, "store_funnel.impressions")), rate = ASO.last(ASO.series(payload, "store_funnel.impression_cvr"));
  tiles.push(ASO.tile("First-time downloads", ASO.figure(payload, "store_funnel.first_downloads", week),
    week && typeof week.value === "number" && seen && typeof seen.value === "number" && rate && typeof rate.value === "number" ?
      ASO.group(seen.value) + " impressions · " + ASO.fmt(rate.value, "ratio") + " download · week of " + ASO.esc(week.id) : "",
    ASO.spark(ASO.values(downloads).map(function (e) { return e.value; }), "First-time downloads, week by week")));

  [["MRR", "subscriptions.mrr_usd"], ["Net cashflow", "money.net_cashflow_usd"],
   ["Deletions per 100 installs", "lifecycle.deletions_per_100"]].forEach(function (pair) {
    var entries = ASO.series(payload, pair[1]), entry = ASO.last(entries);
    tiles.push(ASO.tile(pair[0], ASO.figure(payload, pair[1], entry),
      entry && typeof entry.value === "number" ? ASO.esc((payload.catalog.families[ASO.split(pair[1])[0]].kind === "week" ?
        "week of " : "read on ") + entry.id) : "",
      ASO.spark(ASO.values(entries).map(function (e) { return e.value; }), pair[0] + " over time")));
  });
  return '<div class="tiles">' + tiles.join("") + "</div>";
};

ASO.dueList = function (payload, limit) {
  var due = payload.hypotheses.hypotheses.filter(function (h) { return h.state === "due"; })
    .sort(function (a, b) { return b.days_past_window - a.days_past_window || (a.id < b.id ? -1 : 1); });
  if (!due.length) { return "<p>Nothing is waiting for a verdict.</p>"; }
  return '<ul class="rows">' + due.slice(0, limit || due.length).map(function (h) {
    return '<li><span class="id">' + ASO.esc(h.id) + "</span> <span>" + ASO.esc(h.title) + '</span> <span class="meta">closed ' +
      h.days_past_window + " d ago</span></li>";
  }).join("") + "</ul>";
};

ASO.BANDS = [["top10", "Top 10"], ["top30", "11–30"], ["top100", "31–100"], ["top200", "101–200"]];

ASO.pages["#/"] = function (payload, today) {
  var counts = ASO.countStates(payload), sweep = ASO.last(ASO.fullSweeps(payload));
  var out = '<section class="strip"><h2 class="cap">Sources and their age · stale is older than ' + ASO.STALE_AFTER +
    " days</h2>" + ASO.sources(payload, today) + "</section>" + ASO.headlineTiles(payload);

  out += '<div class="blocks"><section class="block"><h2>Hypotheses</h2><p class="lead">' +
    (counts.due || 0) + " due · " + (counts.open || 0) + " open · " + (counts["not-shipped"] || 0) + " not shipped</p>" +
    ASO.dueList(payload, 5) + '<p><a href="#/ledger">Open the ledger</a></p></section>';

  out += '<section class="block"><h2>Keyword ranks</h2>';
  if (sweep) {
    var figures = sweep.families.ranks.figures;
    out += ASO.stack(ASO.BANDS.map(function (b) { return ["band-" + b[0], figures[b[0]].value, b[1]]; }),
      "Keys by rank band on " + sweep.period.id) + '<p class="lead">' + ASO.BANDS.map(function (b) {
      return ASO.group(figures[b[0]].value) + " " + ASO.esc(b[1]);
    }).join(" · ") + '</p><p class="meta">sweep of ' + ASO.esc(sweep.period.id) + " · " + ASO.group(figures.keys_read.value) +
      " of " + ASO.group(figures.tracked_keys.value) + " tracked keys read</p>";
  } else {
    out += "<p>" + ASO.missing("no_source") + "</p>";
  }
  out += '<p><a href="#/keywords">Open keywords</a></p></section>';

  out += '<section class="block"><h2>Store funnel</h2><dl class="pairs">' +
    [["Impressions", "store_funnel.impressions"], ["Product page views", "store_funnel.page_views"],
     ["First-time downloads", "store_funnel.first_downloads"], ["Downloads per page view", "store_funnel.page_cvr"]
    ].map(function (pair) {
      return "<dt>" + ASO.esc(pair[0]) + "</dt><dd>" + ASO.figure(payload, pair[1], ASO.last(ASO.series(payload, pair[1]))) + "</dd>";
    }).join("") + '</dl><p><a href="#/funnel">Open the store funnel</a></p></section>';

  out += '<section class="block"><h2>Ratings and reviews</h2><dl class="pairs">' +
    payload.places.overview.filter(function (key) { return key.indexOf("ratings.") === 0; }).map(function (key) {
      return "<dt>" + ASO.esc(ASO.spec(payload, key).title) + "</dt><dd>" + ASO.figure(payload, key, ASO.last(ASO.series(payload, key))) + "</dd>";
    }).join("") + "</dl></section>";

  var charts = ASO.listOf(payload, "charts", "rows");
  out += '<section class="block">\n<h2>Category charts</h2>' + (charts ? '<p class="meta">read on ' + ASO.esc(charts.family.fetched_at) + " " +
    ASO.age(charts.family.fetched_at, today) + '</p><ul class="rows two">' + charts.rows.map(function (r) {
      return '<li><span class="id">' + ASO.esc(r.market) + "</span> <span>" + ASO.esc(r.genre) + " " + ASO.esc(r.chart_type) + ' <span class="mono strong">' +
        (r.status === "ok" ? "#" + r.position : r.status === "error" ? "request failed" : "not in the chart") + "</span></span></li>";
    }).join("") + "</ul>" : ASO.gapNote({ code: "no_source", reason: "No data file holds a reading of it." })) + "</section></div>";
  return out;
};

// Ledger: what to judge, what to decide, what comes next; every hypothesis as a square; the timeline; and for each
// hypothesis whose window has closed, what was read against what it predicted. The page writes no verdict.
ASO.MARKS = [["worked", "worked"], ["no-effect", "no-effect"], ["adverse", "adverse"], ["withheld", "withheld"],
             ["due", "due"], ["open", "open"], ["not-shipped", "not shipped"]];
ASO.SERIES = ["s1", "s2", "s3", "s4"];        // a fixed order of series colours; a fifth query and on is drawn grey

ASO.markLabel = function (mark) {
  var found = ASO.MARKS.filter(function (m) { return m[0] === mark; })[0];
  return found ? found[1] : mark;
};

ASO.basketLine = function (h) {
  if (!h.basket) { return ""; }
  return h.basket.up + " up · " + h.basket.down + " down · " + h.basket.flat + " flat" +
    (h.basket.unpaired ? " · " + h.basket.unpaired + " unpaired" : "") +
    (h.basket.unmeasurable ? " · " + h.basket.unmeasurable + " unmeasurable" : "");
};

ASO.queueList = function (payload, today) {
  var queue = payload.events.queue;
  if (!queue.length) { return "<p>Nothing is queued.</p>"; }
  return '<ul class="rows">' + queue.map(function (q) {
    return '<li><span class="id">' + ASO.esc(q.id) + "</span> <span>" + ASO.esc(q.title) + '</span> <span class="meta">queued ' +
      ASO.days(q.date, today) + " d ago</span></li>";
  }).join("") + "</ul>";
};

// The ledger's own order: by score, then storefront, then key, all descending. The page sorts; it scores nothing.
ASO.nextList = function (payload, limit) {
  var rows = payload.keys.keys.filter(function (k) { return k.priority; }).sort(function (a, b) {
    return b.priority.score - a.priority.score || (a.market < b.market ? 1 : a.market > b.market ? -1 : 0) ||
      (a.keyword < b.keyword ? 1 : -1);
  }).slice(0, limit);
  if (!rows.length) { return "<p>" + ASO.missing("no_data") + "</p>"; }
  return '<ul class="next">' + rows.map(function (k) {
    return '<li><span class="id">' + ASO.esc(k.market) + "</span> <span>" + ASO.esc(k.keyword) + ' <span class="meta">' +
      ASO.esc(k.priority.status.toLowerCase()) + '</span></span> <span class="mono">' +
      (k.priority.position === null ? "beyond depth" : "#" + k.priority.position) + '</span> <span class="mono strong">' +
      k.priority.score.toFixed(2) + "</span></li>";
  }).join("") + "</ul>";
};

ASO.squares = function (payload) {
  var all = payload.hypotheses.hypotheses, counts = {};
  all.forEach(function (h) { var m = ASO.mark(h); counts[m] = (counts[m] || 0) + 1; });
  var judged = all.filter(function (h) { return h.state === "judged"; }).length;
  return '<div class="squares">' + all.map(function (h) {
    return '<span class="sq m-' + ASO.esc(ASO.mark(h)) + '" title="' + ASO.esc(h.id + " · " + ASO.markLabel(ASO.mark(h))) + '"></span>';
  }).join("") + '</div><ul class="legend">' + ASO.MARKS.filter(function (m) { return counts[m[0]]; }).map(function (m) {
    return '<li><span class="sq m-' + m[0] + '"></span><strong>' + counts[m[0]] + "</strong> " + ASO.esc(m[1]) + "</li>";
  }).join("") + '</ul><p class="lead">Of ' + judged + " judged, " + (counts.worked || 0) + " worked.</p>";
};

ASO.verdictList = function (payload, verdict) {
  var rows = payload.hypotheses.hypotheses.filter(function (h) { return h.verdict === verdict; });
  if (!rows.length) { return '<p class="meta">None.</p>'; }
  return '<ul class="rows two">' + rows.map(function (h) {
    return '<li><span class="id">' + ASO.esc(h.id) + "</span> <span>" + ASO.esc(h.title) +
      (h.basket ? ' <span class="meta">' + ASO.esc(ASO.basketLine(h)) + "</span>" : "") + "</span></li>";
  }).join("") + "</ul>";
};

// One drawing for all hypotheses that went live: a bar from the live day to the end of the declared window.
ASO.timeline = function (payload, today) {
  var live = payload.hypotheses.hypotheses.filter(function (h) { return h.went_live; })
    .sort(function (a, b) { return a.went_live < b.went_live ? -1 : a.went_live > b.went_live ? 1 : (a.id < b.id ? -1 : 1); });
  if (!live.length) { return "<p>No hypothesis has gone live yet.</p>"; }
  var first = live[0].went_live.slice(0, 8) + "01";
  var last = live.reduce(function (day, h) { return h.window_end > day ? h.window_end : day; }, today);
  var span = ASO.days(first, last) + 3, left = 340, width = 650, row = 24, top = 30;
  var height = top + live.length * row + 6;
  function x(day) { return (left + width * ASO.days(first, day) / span).toFixed(1); }
  var out = '<svg class="timeline" viewBox="0 0 1000 ' + height + '" role="img" aria-label="Hypotheses from the day each went live to the end of its window">';
  for (var month = first; month <= last;) {
    out += '<line class="tl-month" x1="' + x(month) + '" y1="18" x2="' + x(month) + '" y2="' + height + '"/><text class="tl-axis" x="' +
      (+x(month) + 4) + '" y="12">' + ASO.esc(month.slice(0, 7)) + "</text>";
    var y = +month.slice(0, 4), m = +month.slice(5, 7) + 1;
    if (m > 12) { m = 1; y += 1; }
    month = y + "-" + (m < 10 ? "0" : "") + m + "-01";
  }
  payload.events.releases.forEach(function (r) {
    if (r.date >= first && r.date <= last) {
      out += '<line class="tl-release" x1="' + x(r.date) + '" y1="18" x2="' + x(r.date) + '" y2="' + height + '"/><text class="tl-axis strong" x="' +
        (+x(r.date) + 4) + '" y="26">' + ASO.esc(r.version) + "</text>";
    }
  });
  out += '<line class="tl-today" x1="' + x(today) + '" y1="18" x2="' + x(today) + '" y2="' + height + '"/><text class="tl-axis strong" x="' +
    (+x(today) - 4) + '" y="12" text-anchor="end">today</text>';
  live.forEach(function (h, i) {
    var mid = top + i * row + 12, mark = ASO.mark(h), title = h.title.length > 36 ? h.title.slice(0, 35) + "…" : h.title;
    out += '<text class="tl-id" x="0" y="' + (mid + 4) + '">' + ASO.esc(h.id) + '</text><text class="tl-title" x="48" y="' + (mid + 4) + '">' +
      ASO.esc(title) + '</text><rect class="tl-bar m-' + ASO.esc(mark) + '" x="' + x(h.went_live) + '" y="' + (mid - 6) + '" width="' +
      Math.max(3, +x(h.window_end) - +x(h.went_live)).toFixed(1) + '" height="12" rx="3"><title>' +
      ASO.esc(h.id + " · " + ASO.markLabel(mark) + " · " + h.went_live + " → " + h.window_end) + "</title></rect>";
  });
  return '<div class="scroll">' + out + "</svg></div>";
};

// The positions of a hypothesis's own keys, read by read, with the live day, the end of its window and today.
ASO.rankChart = function (payload, h, today) {
  var dates = payload.keys.dates, byKey = {};
  payload.keys.keys.forEach(function (k) { byKey[k.market + "\n" + k.keyword] = k; });
  var keys = h.basket_keys.map(function (pair) { return byKey[pair[0] + "\n" + pair[1]]; }).filter(Boolean);
  if (!keys.length || !dates.length) { return ""; }
  var first = dates[0] < h.went_live ? dates[0] : h.went_live, span = ASO.days(first, today) || 1, deepest = 30;
  keys.forEach(function (k) { k.positions.forEach(function (p) { if (typeof p === "number" && p > deepest) { deepest = p; } }); });
  function x(day) { return (40 + 700 * ASO.days(first, day) / span).toFixed(1); }
  function y(position) { return (16 + 170 * (position - 1) / (deepest - 1)).toFixed(1); }
  var out = '<svg class="rank-chart" viewBox="0 0 760 214" role="img" aria-label="Positions of this hypothesis\'s keys, read by read">';
  [1, Math.round(deepest / 2), deepest].forEach(function (rank) {
    out += '<line class="grid" x1="40" y1="' + y(rank) + '" x2="750" y2="' + y(rank) + '"/><text class="tl-axis" x="34" y="' +
      (+y(rank) + 4) + '" text-anchor="end">#' + rank + "</text>";
  });
  [["v-live", h.went_live, "live " + h.went_live], ["v-end", h.window_end, "window end"], ["v-today", today, "today"]].forEach(function (v) {
    if (v[1] >= first && v[1] <= today) {
      out += '<line class="' + v[0] + '" x1="' + x(v[1]) + '" y1="10" x2="' + x(v[1]) + '" y2="192"/><text class="tl-axis" x="' +
        (+x(v[1]) - 4) + '" y="206" text-anchor="end">' + ASO.esc(v[2]) + "</text>";
    }
  });
  var legend = "";
  keys.forEach(function (k, i) {
    var tone = ASO.SERIES[i] || "s-rest", points = [], latest = null;
    k.positions.forEach(function (p, at) {
      if (typeof p === "number") { points.push(x(dates[at]) + "," + y(p)); latest = p; }
    });
    out += '<polyline class="' + tone + '" points="' + points.join(" ") + '"/>';
    points.forEach(function (point) {
      var xy = point.split(",");
      out += '<circle class="' + tone + '" cx="' + xy[0] + '" cy="' + xy[1] + '" r="3"/>';
    });
    legend += '<li><svg class="swatch" viewBox="0 0 14 4"><rect class="' + tone + '" width="14" height="4"/></svg>' +
      ASO.esc(k.market) + " · " + ASO.esc(k.keyword) + ' <span class="mono">' + (latest === null ? "no position yet" : "#" + latest) + "</span></li>";
  });
  return '<ul class="legend">' + legend + '</ul><div class="scroll">' + out + "</svg></div>";
};

ASO.dueCard = function (payload, h, today) {
  var reads = h.reads_in_window;
  var out = '<section class="block due-card" id="due-' + ASO.esc(h.id) + '"><h2><span class="id">' + ASO.esc(h.id) + "</span> " +
    ASO.esc(h.title) + ' <span class="chip due">due · window closed ' + ASO.esc(h.window_end) + '</span></h2><p class="meta">live ' +
    ASO.esc(h.went_live) + " · " + h.window_days + " days · signal: " + ASO.esc(h.signal) +
    (h.markets.length ? " · " + ASO.esc(h.markets.join(", ")) : "") + "</p>";
  if (reads === null) {
    out += '<p class="note">This hypothesis is not judged on rank, so there is no position to draw. Its evidence is in the ' +
      ASO.esc(h.signal) + " figures of its window.</p>";
  } else {
    out += '<p class="lead"><span class="chip' + (reads ? "" : " due") + '">' + reads + (reads === 1 ? " read" : " reads") +
      " inside the window</span> " + ASO.esc(ASO.basketLine(h)) + "</p>" + ASO.rankChart(payload, h, today);
    if (h.queries.length > h.basket_keys.length) {
      out += '<p class="meta">' + (h.queries.length * Math.max(1, h.markets.length) - h.basket_keys.length) +
        " of its queries name no tracked key, so nothing was read for them.</p>";
    }
  }
  out += '<dl class="terms">';
  [["Queries", h.queries.join(" · ")], ["Prediction", h.prediction], ["Kill criterion", h.kill_criterion],
   ["Confounds", h.confounds.join(" · ")]].forEach(function (pair) {
    if (pair[1]) { out += "<dt>" + pair[0] + "</dt><dd>" + ASO.esc(pair[1]) + "</dd>"; }
  });
  return out + "</dl></section>";
};

ASO.pages["#/ledger"] = function (payload, today) {
  var due = payload.hypotheses.hypotheses.filter(function (h) { return h.state === "due"; })
    .sort(function (a, b) { return b.days_past_window - a.days_past_window || (a.id < b.id ? -1 : 1); });
  var out = '<h1 class="page">Close before proposing</h1><div class="blocks"><section class="block">\n<h2>Judge</h2><p class="meta">' +
    due.length + " window" + (due.length === 1 ? "" : "s") + " closed with no verdict</p>" + ASO.dueList(payload) +
    '</section><section class="block">\n<h2>Decide</h2><p class="meta">' + payload.events.queue.length + " queued approval" +
    (payload.events.queue.length === 1 ? "" : "s") + "</p>" + ASO.queueList(payload, today) +
    '</section><section class="block">\n<h2>Next by money at stake</h2>' + ASO.nextList(payload, 5) +
    '<p class="meta">Score = net proceeds per subscriber × unclaimed gain × reach. An order, not a forecast.</p></section></div>';

  out += '<div class="blocks"><section class="block">\n<h2>' + payload.hypotheses.hypotheses.length + " hypotheses</h2>" + ASO.squares(payload) +
    '</section><section class="block">\n<h2>What worked</h2>' + ASO.verdictList(payload, "worked") +
    '</section><section class="block">\n<h2>What hurt</h2>' + ASO.verdictList(payload, "adverse") + "</section></div>";

  out += '<section class="block">\n<h2>Timeline</h2><p class="meta">Each bar runs from the day a change went live to the end of its declared window.</p>' +
    ASO.timeline(payload, today) + "</section>";
  if (due.length) {
    out += '<h1 class="page">Due: what was predicted, what was read</h1>' +
      due.map(function (h) { return ASO.dueCard(payload, h, today); }).join("");
  }
  return out;
};

// Keywords: the share of keys in each rank band sweep by sweep, the newest sweep by storefront, what moved,
// how much of the ledger can be compared at all, and every tracked key with its own series.
ASO.partialSweeps = function (payload) {
  var full = ASO.fullSweeps(payload);
  return payload.snapshots.filter(function (file) { return file.families.ranks && file.families.ranks.figures && full.indexOf(file) < 0; });
};

// One column per full sweep: the share of the keys read that day in each band, best band at the bottom.
ASO.bandScale = function (sweeps) {
  var most = 0;
  sweeps.forEach(function (file) {
    var f = file.families.ranks.figures, inside = 0;
    ASO.BANDS.forEach(function (band) { inside += f[band[0]].value; });
    if (f.keys_read.value) { most = Math.max(most, inside / f.keys_read.value); }
  });
  return Math.min(1, Math.max(0.05, Math.ceil(most * 20) / 20));        // the next 5% step above the tallest column
};

ASO.bandChart = function (sweeps) {
  var step = 78, width = Math.max(520, 60 + sweeps.length * step), out = "", top = ASO.bandScale(sweeps);
  sweeps.forEach(function (file, i) {
    var f = file.families.ranks.figures, read = f.keys_read.value, x = 50 + i * step, y = 150;
    out += '<rect class="col-track" x="' + x + '" y="10" width="44" height="140"/>';
    ASO.BANDS.forEach(function (band) {
      var height = read ? 140 * f[band[0]].value / read / top : 0;
      if (height > 0) {
        y -= height;
        out += '<rect class="band-' + band[0] + '" x="' + x + '" y="' + y.toFixed(1) + '" width="44" height="' +
          Math.max(0, height - 1).toFixed(1) + '"><title>' + ASO.esc(band[1] + " · " + f[band[0]].value + " of " + read + " read") + "</title></rect>";
      }
    });
    out += '<text class="tl-axis" x="' + (x + 22) + '" y="166" text-anchor="middle">' + ASO.esc(file.period.id.slice(5)) + "</text>" +
      '<text class="tl-axis strong" x="' + (x + 22) + '" y="181" text-anchor="middle">' +
      (f.share_top30.unavailable ? "–" : ASO.esc(ASO.fmt(f.share_top30.value, "ratio"))) + "</text>";
  });
  return '<div class="scroll"><svg class="band-chart" viewBox="0 0 ' + width + ' 188" role="img" aria-label="Share of keys read in each rank band, sweep by sweep">' +
    '<line class="grid" x1="40" y1="150" x2="' + width + '" y2="150"/><text class="tl-axis" x="36" y="14" text-anchor="end">' + Math.round(top * 100) + "%</text>" +
    '<text class="tl-axis" x="36" y="154" text-anchor="end">0%</text>' + out + "</svg></div>";
};

ASO.sweepTable = function (payload, sweeps) {
  var keys = ["ranks.keys_read", "ranks.top10", "ranks.top30", "ranks.top100", "ranks.top200", "ranks.share_top30"];
  var head = "<tr><th>Sweep</th>" + keys.map(function (k) { return "<th>" + ASO.esc(ASO.spec(payload, k).title) + "</th>"; }).join("") + "</tr>";
  var series = {};
  keys.forEach(function (k) { ASO.series(payload, k).forEach(function (e) { (series[e.id] = series[e.id] || {})[k] = e; }); });
  return '<div class="scroll"><table class="grid-table"><thead>' + head + "</thead><tbody>" + sweeps.slice().reverse().map(function (file) {
    return '<tr class="sweep"><td>' + ASO.esc(file.period.id) + "</td>" + keys.map(function (k) {
      return "<td>" + ASO.figure(payload, k, series[file.period.id][k]) + "</td>";
    }).join("") + "</tr>";
  }).join("") + "</tbody></table></div>";
};

ASO.storefronts = function (sweep) {
  var f = sweep.families.ranks.figures, share = f.share_top30.by_market || {}, read = f.keys_read.by_market || {};
  var markets = Object.keys(read).filter(function (m) { return read[m] > 0; }).sort(function (a, b) {
    return (share[b] || 0) - (share[a] || 0) || (a < b ? -1 : 1);
  });
  return '<ul class="bars">' + markets.map(function (m) {
    return '<li><span class="id">' + ASO.esc(m) + "</span>" + ASO.bar(share[m] || 0, m + " share of keys read in the top 30") +
      '<span class="mono">' + (share[m] === null ? "–" : ASO.fmt(share[m], "ratio")) + " of " + read[m] + " read</span></li>";
  }).join("") + "</ul>";
};

ASO.position = function (p) { return p === null ? "beyond depth" : "#" + p; };

ASO.moverList = function (rows) {
  if (!rows.length) { return '<p class="meta">None.</p>'; }
  return '<ul class="next">' + rows.map(function (k) {
    var m = k.movement;
    return '<li><span class="id">' + ASO.esc(k.market) + "</span> <span>" + ASO.esc(k.keyword) + '</span> <span class="mono">' +
      ASO.position(m.first) + " → " + ASO.position(m.last) + '</span> <span class="mono strong">' + (m.delta > 0 ? "+" : "−") + Math.abs(m.delta) + "</span></li>";
  }).join("") + "</ul>";
};

ASO.READ = { b: "beyond depth", e: "request failed", z: "no results" };

// A key's positions as a small line, rank 1 at the top; only the reads that returned a position are joined.
ASO.keySpark = function (positions) {
  var seen = [];
  positions.forEach(function (p, i) { if (typeof p === "number") { seen.push([i, p]); } });
  if (seen.length < 2) { return ""; }
  var low = Math.min.apply(null, seen.map(function (s) { return s[1]; })), high = Math.max.apply(null, seen.map(function (s) { return s[1]; }));
  var span = high - low || 1, last = positions.length - 1 || 1;
  return '<svg class="spark" viewBox="0 0 120 28" aria-hidden="true"><polyline points="' + seen.map(function (s) {
    return (2 + 116 * s[0] / last).toFixed(1) + "," + (2 + 24 * (s[1] - low) / span).toFixed(1);
  }).join(" ") + '"/></svg>';
};

ASO.keyTable = function (payload) {
  var rows = payload.keys.keys.map(function (k) {
    var latest = null;
    k.positions.forEach(function (p) { if (p !== null) { latest = p; } });
    var m = k.movement;
    return '<tr class="key' + (k.brand ? " is-brand" : "") + '"><td class="id">' + ASO.esc(k.market) + "</td><td>" + ASO.esc(k.keyword) +
      (k.brand ? ' <span class="chip">brand</span>' : "") + '</td><td class="meta">' + ASO.esc(k.group) + "</td><td>" + ASO.keySpark(k.positions) +
      '</td><td class="mono">' + (latest === null ? "never read" : typeof latest === "number" ? "#" + latest : ASO.READ[latest]) +
      '</td><td class="mono">' + (m && m.delta !== null ? (m.delta > 0 ? "+" : m.delta < 0 ? "−" : "") + Math.abs(m.delta) : m ? ASO.esc(m.label.toLowerCase()) : "") +
      '</td><td class="mono">' + (k.priority && k.priority.demand ? ASO.esc(k.priority.demand) : "") + "</td></tr>";
  }).join("");
  return '<div class="scroll"><table class="grid-table keys"><thead><tr><th>Mkt</th><th>Key</th><th>Group</th><th>Positions</th><th>Latest read</th>' +
    "<th>First → latest</th><th>Apple demand</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
};

ASO.pages["#/keywords"] = function (payload, today) {
  var sweeps = ASO.fullSweeps(payload), partial = ASO.partialSweeps(payload), newest = ASO.last(sweeps);
  if (!newest) {
    return '<h1 class="page">Keyword ranks</h1><section class="block"><p>' + ASO.missing("no_source") +
      "</p><p>No full rank sweep is in the data yet.</p></section>";
  }
  var movers = payload.keys.keys.filter(function (k) { return !k.brand && k.movement; });
  var gains = movers.filter(function (k) { return k.movement.delta > 0; }).sort(function (a, b) { return b.movement.delta - a.movement.delta; });
  var losses = movers.filter(function (k) { return k.movement.delta < 0; }).sort(function (a, b) { return a.movement.delta - b.movement.delta; });
  var entered = movers.filter(function (k) { return k.movement.label.indexOf("ENTERED") === 0; }).length;
  var exited = movers.filter(function (k) { return k.movement.label.indexOf("EXITED") === 0; }).length;

  var out = '<h1 class="page">Keyword ranks</h1><p class="meta">Non-brand keys · newest full sweep ' + ASO.esc(newest.period.id) + " " +
    ASO.age(newest.period.id, today) + '</p><div class="blocks wide"><section class="block">\n<h2>Share of keys read in each band</h2><ul class="legend">' +
    ASO.BANDS.map(function (b) { return '<li><svg class="swatch tall" viewBox="0 0 12 12"><rect class="band-' + b[0] + '" width="12" height="12"/></svg>' + ASO.esc(b[1]) + "</li>"; }).join("") +
    "</ul>" + ASO.bandChart(sweeps) + '<p class="meta">A column is the share of the keys read that day that sit inside the top 200, band by band; ' +
    "the scale stops at " + Math.round(ASO.bandScale(sweeps) * 100) + "%. The number under a column is the share at positions 1 to 30." +
    (partial.length ? " " + partial.length + " sweep" + (partial.length === 1 ? "" : "s") + " left out as partial: " + partial.map(function (file) {
      var f = file.families.ranks.figures;
      return ASO.esc(file.period.id) + " read " + f.keys_read.value + " of " + f.tracked_keys.value + " tracked keys";
    }).join("; ") + "." : "") + "</p>" + ASO.sweepTable(payload, sweeps) + "</section>";

  out += '<section class="block">\n<h2>Top 30 by storefront</h2><p class="meta">sweep of ' + ASO.esc(newest.period.id) + "</p>" + ASO.storefronts(newest) + "</section></div>";

  out += '<div class="blocks"><section class="block">\n<h2>Largest gains</h2>' + ASO.moverList(gains.slice(0, 8)) +
    '</section><section class="block">\n<h2>Largest losses</h2>' + ASO.moverList(losses.slice(0, 8)) +
    '</section><section class="block">\n<h2>Coverage of the measurement</h2><dl class="pairs">' +
    payload.places.keywords.filter(function (key) { return key.indexOf("coverage.") === 0; }).map(function (key) {
      return "<dt>" + ASO.esc(ASO.spec(payload, key).title) + "</dt><dd>" + ASO.figure(payload, key, ASO.last(ASO.series(payload, key))) + "</dd>";
    }).join("") + '</dl><p class="meta">First read against the latest, per key. ' + entered + " entered the ranking · " + exited +
    " fell out of depth.</p></section></div>";

  out += '<section class="block">\n<h2>Every tracked key</h2><p class="meta">' + payload.keys.keys.length + " keys on " + payload.keys.dates.length +
    " sweep dates</p>" + ASO.keyTable(payload) + "</section>";
  return out;
};

// Store funnel, Money, Apple Ads, In-app, How data gets here. Each family is drawn from whatever periods hold it,
// so a tab fills in by itself the day its series is stored; until then it says why it is empty.

// Why a family has no reading anywhere: the newest reason its files give, or that no file holds it. Null when read.
ASO.familyGap = function (payload, family) {
  var newest = null, read = false;
  ASO.periods(payload, family).forEach(function (file) {
    var found = file.families[family];
    if (!found) { return; }
    if (found.unavailable) { newest = found.unavailable; } else { read = true; }
  });
  return read ? null : newest || { code: "no_source", reason: "No data file holds a reading of it." };
};

ASO.gapNote = function (gap) {
  return '<p class="note"><span class="missing">' + ASO.esc(ASO.MISSING[gap.code]) + "</span> " + ASO.esc(gap.reason) + "</p>";
};

ASO.readFiles = function (payload, family) {
  return ASO.periods(payload, family).filter(function (file) { return file.families[family] && !file.families[family].unavailable; });
};

// One row per period that holds the family, newest first; one column per figure.
ASO.periodTable = function (payload, family, names, limit) {
  var files = ASO.readFiles(payload, family).slice().reverse().slice(0, limit || 26), week = payload.catalog.families[family].kind === "week";
  var cells = {};
  names.forEach(function (name) {
    ASO.series(payload, family + "." + name).forEach(function (e) { (cells[e.id] = cells[e.id] || {})[name] = e; });
  });
  return '<div class="scroll"><table class="grid-table"><thead><tr><th>' + (week ? "Week of" : "Read on") + "</th>" + names.map(function (name) {
    return "<th>" + ASO.esc(ASO.spec(payload, family + "." + name).title) + "</th>";
  }).join("") + "</tr></thead><tbody>" + files.map(function (file) {
    return '<tr class="period"><td>' + ASO.esc(file.period.id) + "</td>" + names.map(function (name) {
      return "<td>" + ASO.figure(payload, family + "." + name, (cells[file.period.id] || {})[name]) + "</td>";
    }).join("") + "</tr>";
  }).join("") + "</tbody></table></div>";
};

// The newest period's figures split by storefront (or campaign), largest first by the first figure.
ASO.splitTable = function (payload, family, names, by) {
  var file = ASO.last(ASO.readFiles(payload, family));
  if (!file) { return ""; }
  var figures = file.families[family].figures, lead = (figures[names[0]] || {})[by] || {};
  var who = Object.keys(lead).sort(function (a, b) { return (lead[b] || 0) - (lead[a] || 0) || (a < b ? -1 : 1); });
  if (!who.length) { return '<p class="meta">The data holds no split for ' + ASO.esc(file.period.id) + ".</p>"; }
  return '<p class="meta">' + (payload.catalog.families[family].kind === "week" ? "week of " : "read on ") + ASO.esc(file.period.id) +
    '</p><div class="scroll"><table class="grid-table"><thead><tr><th>' + (by === "by_market" ? "Mkt" : "Campaign") + "</th>" + names.map(function (name) {
      return "<th>" + ASO.esc(ASO.spec(payload, family + "." + name).title) + "</th>";
    }).join("") + "</tr></thead><tbody>" + who.map(function (one) {
      return '<tr class="split-row"><td class="id">' + ASO.esc(one) + "</td>" + names.map(function (name) {
        var value = ((figures[name] || {})[by] || {})[one];
        return "<td>" + (typeof value === "number" ? ASO.esc(ASO.fmt(value, ASO.spec(payload, family + "." + name).unit)) : "–") + "</td>";
      }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
};

// The latest reading of each figure of a family, as pairs.
ASO.latestPairs = function (payload, family, names) {
  return '<dl class="pairs">' + names.map(function (name) {
    var key = family + "." + name;
    return "<dt>" + ASO.esc(ASO.spec(payload, key).title) + "</dt><dd>" + ASO.figure(payload, key, ASO.last(ASO.series(payload, key))) + "</dd>";
  }).join("") + "</dl>";
};

ASO.familyBlock = function (payload, today, title, family, body) {
  var gap = ASO.familyGap(payload, family), day = ASO.fetched(payload, family);
  return '<section class="block">\n<h2>' + ASO.esc(title) + "</h2>" + (gap ? ASO.gapNote(gap) :
    '<p class="meta">fetched ' + ASO.esc(day) + " " + ASO.age(day, today) + "</p>" + body()) + "</section>";
};

ASO.FUNNEL = ["impressions", "page_views", "first_downloads", "view_rate", "page_cvr", "impression_cvr"];
ASO.LIFECYCLE = ["optin_installs", "optin_deletions", "deleted_within_1d", "deletions_per_100"];
ASO.MONEY = ["proceeds_usd", "ad_spend_usd", "net_cashflow_usd", "transactions", "new_trials"];
ASO.SUBSCRIPTIONS = ["active_subscriptions", "active_trials", "mrr_usd", "revenue_28d_usd", "new_customers_28d", "active_users_28d"];
ASO.ADS = ["spend_usd", "impressions", "taps", "installs", "ttr", "cpi_usd"];

ASO.pages["#/funnel"] = function (payload, today) {
  return '<h1 class="page">Store funnel</h1><p class="meta">Only closed weeks are shown. The week in progress appears the Monday after it ends.</p>' +
    ASO.familyBlock(payload, today, "Closed weeks", "store_funnel", function () { return ASO.periodTable(payload, "store_funnel", ASO.FUNNEL); }) +
    ASO.familyBlock(payload, today, "By storefront", "store_funnel", function () { return ASO.splitTable(payload, "store_funnel", ASO.FUNNEL, "by_market"); }) +
    ASO.familyBlock(payload, today, "Install lifecycle", "lifecycle", function () {
      return ASO.periodTable(payload, "lifecycle", ASO.LIFECYCLE) + ASO.splitTable(payload, "lifecycle", ASO.LIFECYCLE, "by_market");
    });
};

ASO.pages["#/money"] = function (payload, today) {
  return '<h1 class="page">Money</h1><p class="meta">What was read, never a forecast.</p>' +
    ASO.familyBlock(payload, today, "Subscriptions", "subscriptions", function () {
      return ASO.latestPairs(payload, "subscriptions", ASO.SUBSCRIPTIONS) + ASO.periodTable(payload, "subscriptions", ASO.SUBSCRIPTIONS);
    }) +
    ASO.familyBlock(payload, today, "Money by closed week", "money", function () {
      return ASO.periodTable(payload, "money", ASO.MONEY) + ASO.splitTable(payload, "money", ASO.MONEY, "by_market");
    });
};

// The newest snapshot that holds one of a family's row lists.
ASO.listOf = function (payload, family, name) {
  var file = ASO.last(payload.snapshots.filter(function (f) { return f.families[family] && f.families[family][name]; }));
  return file ? { rows: file.families[family][name], family: file.families[family] } : null;
};

ASO.measured = function (family) {
  return '<p class="meta">' + (family.measured ? "measured " + ASO.esc(family.measured.start) + " → " + ASO.esc(family.measured.end) + " · " : "") +
    "captured " + ASO.esc(family.fetched_at) + "</p>";
};

ASO.pages["#/ads"] = function (payload, today) {
  var out = '<h1 class="page">Apple Ads</h1>' + ASO.familyBlock(payload, today, "Apple Ads by closed week", "ads", function () {
    return ASO.periodTable(payload, "ads", ASO.ADS) + ASO.splitTable(payload, "ads", ASO.ADS, "by_campaign");
  });
  var share = ASO.listOf(payload, "impression_share", "rows");
  out += '<div class="blocks"><section class="block">\n<h2>Impression share</h2>' + (share ? ASO.measured(share.family) + '<ul class="next range">' +
    share.rows.map(function (r) {
      // a blank cell is null, and null is not a zero: it is drawn as a dash, never as #null or 0.0%
      var share = function (value) { return typeof value === "number" ? ASO.fmt(value, "ratio") : "–"; };
      return '<li><span class="id">' + ASO.esc(r.market) + "</span> <span>" + ASO.esc(r.term) + '</span> <span class="mono">' +
        (typeof r.rank === "number" ? "#" + r.rank : "–") + '</span> <span class="mono strong">' + share(r.share_low) +
        (r.share_high !== r.share_low ? "–" + share(r.share_high) : "") + "</span></li>";
    }).join("") + "</ul>" : ASO.gapNote({ code: "no_source", reason: "No data file holds a reading of it." })) + "</section>";

  var heads = ASO.listOf(payload, "demand", "rows"), cuts = ASO.listOf(payload, "demand", "cuts");
  out += '<section class="block">\n<h2>Apple search popularity</h2>';
  if (!heads && !cuts) {
    out += ASO.gapNote({ code: "no_source", reason: "No data file holds a reading of it." });
  } else {
    out += ASO.measured((heads || cuts).family) + '<ul class="next three">' + (heads ? heads.rows : []).slice().sort(function (a, b) {
      return b.popularity_100 - a.popularity_100 || (a.term < b.term ? -1 : 1);
    }).map(function (r) {
      // every week the data holds a score for this term, oldest first: drawn, not summed
      var weeks = payload.snapshots.map(function (file) {
        var rows = file.families.demand && file.families.demand.rows || [];
        return rows.filter(function (x) { return x.market === r.market && x.genre === r.genre && x.term === r.term; })[0];
      }).filter(Boolean).map(function (x) { return x.popularity_100; });
      return '<li><span class="id">' + ASO.esc(r.market) + '</span> <span class="meta">' + ASO.esc(r.genre) + "</span> <span>" + ASO.esc(r.term) +
        '</span> <span class="mono strong">' + r.popularity_100 + "</span>" +
        ASO.spark(weeks, r.term + " in " + r.market + ": Apple search popularity over " + weeks.length + " weeks") + "</li>";
    }).join("") + '</ul><p class="cap">What Apple lists per storefront</p><ul class="rows two">' + (cuts ? cuts.rows : []).map(function (r) {
      return '<li><span class="id">' + ASO.esc(r.market) + "</span> <span>" + (r.listed ? ASO.esc(r.genre) + " " + ASO.group(r.listed) +
        " terms listed, lowest score " + (r.min_popularity_100 === null ? "unknown" : r.min_popularity_100) : "Apple lists nothing here") + "</span></li>";
    }).join("") + '</ul><p class="meta">A tracked term that is not listed is below the lowest score listed: volume unknown, not zero.</p>';
  }
  return out + "</section></div>";
};

ASO.pages["#/in-app"] = function (payload, today) {
  var gap = ASO.familyGap(payload, "in_app");
  if (gap) { return '<h1 class="page">In-app</h1><section class="block">\n<h2>In-app</h2>' + ASO.gapNote(gap) + "</section>"; }
  var files = ASO.readFiles(payload, "in_app").slice().reverse().slice(0, 8), sections = {};
  files.forEach(function (file) {
    Object.keys(file.families.in_app.figures || {}).forEach(function (key) {
      var section = key.slice(0, key.indexOf("."));

    });
  });
  var day = ASO.fetched(payload, "in_app");
  return '<h1 class="page">In-app</h1><p class="meta">What the app\'s own events say, by closed week · fetched ' + ASO.esc(day) + " " + ASO.age(day, today) +
    "</p>" + Object.keys(sections).sort().map(function (section) {
      return '<section class="block">\n<h2>' + ASO.esc(section) + '</h2><div class="scroll"><table class="grid-table"><thead><tr><th>Metric</th>' +
        files.map(function (file) { return "<th>" + ASO.esc(file.period.id) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        Object.keys(sections[section]).sort().map(function (key) {
          var cells = {};
          ASO.series(payload, "in_app." + key).forEach(function (e) { cells[e.id] = e; });
          return "<tr><td>" + ASO.esc(key.slice(section.length + 1).replace(/[._]/g, " ")) + "</td>" + files.map(function (file) {
            return "<td>" + (cells[file.period.id] ? ASO.figure(payload, "in_app." + key, cells[file.period.id]) : "–") + "</td>";
          }).join("") + "</tr>";
        }).join("") + "</tbody></table></div></section>";
    }).join("");
};

ASO.pages["#/how"] = function (payload) {
  var codes = Object.keys(ASO.MISSING).map(function (code) {
    return "<dt>" + ASO.missing(code) + '</dt><dd><span class="mono">' + code + "</span> · " + ASO.esc({
      no_source: "nothing stores this figure yet", no_data: "the source answered and had nothing to count",
      not_configured: "the store's config lacks what the collector needs", unreachable: "the request failed"
    }[code]) + "</dd>";
  }).join("");
  return '<h1 class="page">How data gets here</h1><div class="blocks"><section class="block">\n<h2>Three steps</h2><dl class="terms">' +
    "<dt>Collect</dt><dd>Commands read App Store Connect, the search API, the subscription provider and the app's own events, and append what they " +
    "read to the store. This is the only step that touches the network.</dd>" +
    "<dt>Export</dt><dd>One command derives the data files from the store for a given day. It reads no network and no clock: the same store and " +
    "the same day give the same bytes.</dd>" +
    "<dt>Build</dt><dd>One command checks every data file against the contract and builds this page from them, and from nothing else.</dd></dl></section>" +
    '<section class="block">\n<h2>How to read a figure</h2><dl class="terms"><dt>Measured</dt><dd>A value read from a source. Open it to see its ' +
    "definition, its source and the day it was fetched.</dd><dt>Approximation</dt><dd>Marked ≈. It stands in for something that cannot be measured " +
    'directly; its panel says how.</dd><dt>Missing</dt><dd>Words on a hatched mark, never a zero. A measured zero reads 0.</dd></dl><dl class="terms">' +
    codes + '</dl></section><section class="block">\n<h2>Rules the page keeps</h2><ul class="plain"><li>Every figure comes from a data file; the page ' +
    "computes none.</li><li>Only closed weeks are shown.</li><li>A rank sweep that read under half of the tracked keys is left out of trends.</li>" +
    "<li>A source older than " + ASO.STALE_AFTER + " days is marked stale, by the reader's clock.</li><li>The page writes no verdict and no forecast.</li>" +
    '</ul><p class="meta">Data as of ' + ASO.esc(payload.hypotheses.as_of) + ".</p></section></div>";
};

// The only part that touches the page: reads the data, draws the route, opens the panel behind a figure.
ASO.start = function () {
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var main = document.getElementById("app"), dialog = document.getElementById("figure");

  function today() {
    var now = new Date(), two = function (n) { return (n < 10 ? "0" : "") + n; };
    return now.getFullYear() + "-" + two(now.getMonth() + 1) + "-" + two(now.getDate());
  }

  function show() {
    document.getElementById("tabs").innerHTML = ASO.nav(location.hash);
    main.innerHTML = ASO.render(location.hash, payload, today());
    window.scrollTo(0, 0);
  }

  document.getElementById("app-name").textContent = payload.name;
  document.getElementById("as-of").textContent = "data as of " + payload.hypotheses.as_of;
  document.title = "ASO Copilot · " + payload.name;

  main.addEventListener("click", function (event) {
    var button = event.target.closest("[data-fig]");
    if (!button) { return; }
    dialog.innerHTML = ASO.panel(payload, button.getAttribute("data-fig"), button.getAttribute("data-period"));
    dialog.showModal();
  });
  dialog.addEventListener("click", function (event) {
    if (event.target === dialog || event.target.hasAttribute("data-close")) { dialog.close(); }
  });
  window.addEventListener("hashchange", show);
  show();
};

if (typeof document !== "undefined") { ASO.start(); }
</script>
</body>
</html>
